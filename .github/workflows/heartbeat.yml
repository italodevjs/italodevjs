# Re-renders every panel in assets/ and the live block in README.md from the
# account's real state, then commits the result back. This is what makes the
# profile a build artifact rather than a static page.
name: heartbeat

on:
  schedule:
    - cron: "17 5 * * *"   # 02:17 BRT, once a day
  workflow_dispatch:
  push:
    branches: [main]
    # Only source changes retrigger a build. The job's own commit touches
    # assets/, README.md and scripts/snapshot.json, so it cannot loop.
    paths:
      - "scripts/**.py"
      - ".github/workflows/heartbeat.yml"

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render panels and refresh the live block
        env:
          # A classic PAT with read:user gives a richer contribution calendar;
          # the built-in token is enough for everything else.
          GH_GRAPHQL_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md scripts/snapshot.json
          if git diff --staged --quiet; then
            echo "nothing changed since the last build"
            exit 0
          fi
          git commit -m "chore(profile): re-render telemetry [skip ci]"
          git push
