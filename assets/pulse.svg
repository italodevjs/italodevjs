    <text x="0" y="76" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#00E5FF">—</text>
  </g>
  <g transform="translate(260 0)">
    <text x="0" y="52" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" letter-spacing="2" fill="#6E7681">LONGEST</text>
    <text x="0" y="76" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#FF0033">—</text>
  </g>
  <g transform="translate(370 0)">
    <text x="0" y="52" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" letter-spacing="2" fill="#6E7681">CURRENT</text>
    <text x="0" y="76" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#00E5FF">—</text>
  </g>
</g>

<line x1="58" y1="208" x2="1142" y2="208"
      stroke="#161B26" stroke-dasharray="3 6"/>

<g clip-path="url(#ecgReveal)">
  <path d="" fill="url(#ecgArea)"/>
  <path d="" fill="none" stroke="url(#ecgStroke)" stroke-width="1.9"
        stroke-linejoin="round" stroke-linecap="round" filter="url(#softGlow)"/>
  
</g>

<g opacity="0.55">
  <rect x="0" y="70" width="70" height="160" fill="url(#probeGrad)"/>
  <rect x="68" y="70" width="2" height="160" fill="#00E5FF"/>
  <animateTransform attributeName="transform" type="translate"
