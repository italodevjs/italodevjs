<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Contribution cardiogram for the last 365 days" fill="none"><title>Contribution cardiogram for the last 365 days</title><defs>
  <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF0033" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FF0033" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF0033" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF0033" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#FF0033" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.35"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hardGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<defs>
  <linearGradient id="ecgArea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF0033" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ecgStroke" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B0000"/>
    <stop offset="45%" stop-color="#FF0033"/>
    <stop offset="100%" stop-color="#00E5FF"/>
  </linearGradient>
  <linearGradient id="probeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.75"/>
  </linearGradient>
  <clipPath id="ecgReveal">
    <rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" values="0;1200" dur="4.5s" fill="freeze"/>
    </rect>
  </clipPath>
</defs>
<rect width="1200" height="300" fill="#05060A"/>
<g stroke="#FF0033" stroke-width="1" opacity="0.045"><line x1="0" y1="0" x2="0" y2="300"/><line x1="30" y1="0" x2="30" y2="300"/><line x1="60" y1="0" x2="60" y2="300"/><line x1="90" y1="0" x2="90" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/><line x1="180" y1="0" x2="180" y2="300"/><line x1="210" y1="0" x2="210" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="270" y1="0" x2="270" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/><line x1="330" y1="0" x2="330" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="390" y1="0" x2="390" y2="300"/><line x1="420" y1="0" x2="420" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/><line x1="510" y1="0" x2="510" y2="300"/><line x1="540" y1="0" x2="540" y2="300"/><line x1="570" y1="0" x2="570" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/><line x1="630" y1="0" x2="630" y2="300"/><line x1="660" y1="0" x2="660" y2="300"/><line x1="690" y1="0" x2="690" y2="300"/><line x1="720" y1="0" x2="720" y2="300"/><line x1="750" y1="0" x2="750" y2="300"/><line x1="780" y1="0" x2="780" y2="300"/><line x1="810" y1="0" x2="810" y2="300"/><line x1="840" y1="0" x2="840" y2="300"/><line x1="870" y1="0" x2="870" y2="300"/><line x1="900" y1="0" x2="900" y2="300"/><line x1="930" y1="0" x2="930" y2="300"/><line x1="960" y1="0" x2="960" y2="300"/><line x1="990" y1="0" x2="990" y2="300"/><line x1="1020" y1="0" x2="1020" y2="300"/><line x1="1050" y1="0" x2="1050" y2="300"/><line x1="1080" y1="0" x2="1080" y2="300"/><line x1="1110" y1="0" x2="1110" y2="300"/><line x1="1140" y1="0" x2="1140" y2="300"/><line x1="1170" y1="0" x2="1170" y2="300"/><line x1="1200" y1="0" x2="1200" y2="300"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="30" x2="1200" y2="30"/><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="300" x2="1200" y2="300"/></g>
<ellipse cx="600" cy="208" rx="620" ry="180" fill="url(#glowRed)" opacity="0.35"/>

