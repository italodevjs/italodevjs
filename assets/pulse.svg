    <text x="0" y="76" font-family="ui-monospace,'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#FF0033">—</text>
  </g>
